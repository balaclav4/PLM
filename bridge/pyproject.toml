[project]
name = "cascadia-bridge"
version = "0.1.0"
description = "FCStd round-trip between Cascadia PLM's vault and the AI Mechanical 3DCAD Design Agent"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cascadia-bridge = "cascadia_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascadia_bridge"]
