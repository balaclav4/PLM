[project]
name = "cascadia-freecad"
version = "0.1.0"
description = "Cascadia PLM in FreeCAD: docked PLM panel and an FCStd vault round-trip"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cascadia-bridge = "cascadia_bridge.cli:main"
fcstd-scan = "cascadia_bridge.fcstd_scan:main"
cascadia-preflight = "cascadia_bridge.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascadia_bridge"]
